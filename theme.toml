# Main highlight color on the active tab
accent = "#cba6f7"
# Text color on the active tab (should contrast with accent)
accentText = "#11111b"
# Dim overlay opacity when selecting (0.0 - 1.0)
dimOpacity = 0.6
# Corner radius on selection outline (0 = square corners)
borderRadius = 0
# Selection outline thickness
outlineThickness = 2
# Distance from bottom edge to the bar
bottomMargin = 60
# Where screenshots are saved. Empty uses $XDG_PICTURES_DIR/Screenshots,
# falling back to ~/Pictures/Screenshots.
saveDirectory = ""
# Global animation toggle (true/false)
animations = true
# Remember the edit toggle state across captures (true/false)
rememberEdit = true
# Tool to use for the "edit" screenshot action.
# "auto" picks the first available: noctalia, satty, gradia.
# Other values: "noctalia", "satty", "gradia", "none" (save without editing).
annotationTool = "auto"
# Notification backend: "auto" (noctalia, then notify-send), "noctalia",
# "libnotify", or "none".
notifications = "auto"

[bar]
# Segmented control background
background = "rgba(38, 38, 38, 0.4)"
# Segmented control border
border = "rgba(255, 255, 255, 0.15)"
# Inactive tab text color
text = "#AAFFFFFF"
# Drop shadow under the bar
shadow = "#80000000"

[toggle]
# Drop shadow under toggle pills
shadow = "#80000000"
# Edit toggle icon color
edit = "#1ABC9C"
# Temp toggle icon color
temp = "#2C66D8"

[share]
# Icon color when device is reachable
connected = "#3498DB"
# Icon color while checking connectivity
pending = "#95A5A6"
# Icon color on connection failure
errorIcon = "white"
# Background color on connection failure
errorBackground = "#E74C3C"

[hooks]
# Command to run after a screenshot is saved (leave empty to disable)
# Placeholders: %f = full path, %n = filename, %d = directory, %t = timestamp
postSaveHook = ""
